<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conectando...</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#0A0A0F;color:#F0EDE8;font-family:'DM Sans',sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;gap:16px;}
  .spinner{width:44px;height:44px;border:3px solid rgba(201,168,76,0.2);border-top-color:#C9A84C;border-radius:50%;animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}
  .msg{color:#9997A0;font-size:14px;font-family:'DM Sans',sans-serif;}
  .err{color:#D46C4C;font-size:13px;max-width:380px;text-align:center;line-height:1.6;padding:12px 16px;background:rgba(212,108,76,0.08);border:1px solid rgba(212,108,76,0.2);border-radius:10px;display:none;}
  .logo{font-family:'Georgia',serif;font-size:20px;color:#C9A84C;margin-bottom:8px;}
</style>
</head>
<body>
<div class="logo">🏦 Cofrinho</div>
<div class="spinner" id="spinner"></div>
<p class="msg" id="msg">Conectando ao Mercado Pago...</p>
<p class="err" id="err"></p>

<script>
const REDIRECT_URI = 'https://venturacastropedro-collab.github.io/Cofrinhos/callback.html';
const API_BASE = 'https://cofrinhos.vercel.app'; // URL da sua Vercel

async function handleCallback() {
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  const state = params.get('state');
  const savedState = localStorage.getItem('mp_oauth_state');

  if (!code) { showErr('Código de autorização não encontrado. Tente fazer login novamente.'); return; }
  if (state !== savedState) { showErr('Estado inválido. Por segurança, tente fazer login novamente.'); return; }

  try {
    setMsg('Verificando credenciais...');

    // Chama nossa API segura na Vercel — Client Secret nunca exposto aqui
    const res = await fetch(`${API_BASE}/api/auth`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code, redirect_uri: REDIRECT_URI }),
    });

    const data = await res.json();

    if (!res.ok || !data.access_token) {
      showErr(`Erro ao autenticar: ${data.error || 'Tente novamente.'}`);
      return;
    }

    // Salva token — validade de 6 meses
    const expiry = Date.now() + (data.expires_in * 1000);
    localStorage.setItem('mp_token', data.access_token);
    localStorage.setItem('mp_token_expiry', expiry.toString());
    localStorage.removeItem('mp_oauth_state');

    // Busca nome do usuário
    setMsg('Carregando seu perfil...');
    try {
      const userRes = await fetch('https://api.mercadopago.com/v1/users/me', {
        headers: { 'Authorization': `Bearer ${data.access_token}` }
      });
      const user = await userRes.json();
      localStorage.setItem('mp_user', JSON.stringify({ 
        id: user.id, 
        first_name: user.first_name, 
        last_name: user.last_name,
        email: user.email 
      }));
      setMsg(`Bem-vindo, ${user.first_name}! Redirecionando...`);
    } catch {
      setMsg('Redirecionando...');
    }

    setTimeout(() => {
      window.location.href = 'index.html';
    }, 1200);

  } catch(e) {
    showErr(`Erro de conexão: ${e.message}`);
  }
}

function setMsg(txt) { document.getElementById('msg').textContent = txt; }

function showErr(msg) {
  document.getElementById('spinner').style.display = 'none';
  document.getElementById('msg').textContent = 'Algo deu errado';
  const el = document.getElementById('err');
  el.textContent = msg;
  el.style.display = 'block';
  setTimeout(() => { window.location.href = 'index.html'; }, 5000);
}

handleCallback();
</script>
</body>
</html>
